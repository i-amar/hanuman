<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hanuman's Leap</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1036;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:12px;right:120px;color:#fff;pointer-events:none;text-shadow:0 1px 3px #000c;z-index:3}
#hearts{font-size:20px;letter-spacing:2px}
#obj{font-size:13px;margin-top:4px;line-height:1.35;max-width:420px}
#leapwrap{position:fixed;top:12px;right:12px;pointer-events:none;z-index:3;color:#fff;font-size:11px;text-align:right;text-shadow:0 1px 3px #000}
#leapbar{width:96px;height:9px;border:1px solid #fff9;border-radius:6px;overflow:hidden;margin-top:3px}
#leapfill{height:100%;width:100%;background:linear-gradient(90deg,#ffd166,#ff6a00)}
#hint{position:fixed;top:22%;left:50%;transform:translateX(-50%);color:#fff;font-size:17px;font-weight:700;text-align:center;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;width:90%}
#flash{position:fixed;inset:0;background:#c00;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:20}
.card{background:linear-gradient(160deg,#2a1640,#4a1f3a);border:1px solid #ffb34766;border-radius:16px;color:#fff;max-width:440px;width:86%;padding:22px 22px 18px;box-shadow:0 10px 40px #000a;text-align:center}
.card h1{margin:0 0 4px;font-size:26px;color:#ffc94d;letter-spacing:.5px}
.card .sub{font-size:12px;opacity:.75;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px}
.card p{font-size:15px;line-height:1.5;margin:8px 0}
.card .keys{font-size:12.5px;opacity:.85;text-align:left;background:#0003;border-radius:10px;padding:8px 12px;margin-top:10px}
.card button{margin-top:14px;background:linear-gradient(90deg,#ffb347,#ff6a00);border:0;color:#2a0f00;font-weight:800;font-size:16px;padding:12px 28px;border-radius:30px}
#touch{display:none}
#joy{position:fixed;left:0;bottom:0;width:48%;height:55%;z-index:5}
#joybase{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #fff5;background:#ffffff14;display:none;pointer-events:none;z-index:6}
#joyknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#ffffff55}
.btn{position:fixed;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff70;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:6;letter-spacing:.5px;text-shadow:0 1px 2px #000}
.btn.on{background:#ffb34766}
#bAtk{width:86px;height:86px;right:18px;bottom:26px;font-size:14px}
#bJump{width:66px;height:66px;right:118px;bottom:20px}
#bLeap{width:66px;height:66px;right:28px;bottom:126px;border-color:#ffb347}
#bLeap.pulse{animation:pulse 0.8s infinite}
@keyframes pulse{50%{transform:scale(1.15);background:#ff6a0088}}
</style>
</head>
<body>
<div id="hud"><div id="hearts"></div><div id="obj"></div></div>
<div id="leapwrap">LEAP<div id="leapbar"><div id="leapfill"></div></div></div>
<div id="hint"></div>
<div id="flash"></div>
<div id="touch">
  <div id="joy"></div>
  <div id="joybase"><div id="joyknob"></div></div>
  <div class="btn" id="bAtk">GADA</div>
  <div class="btn" id="bJump">JUMP</div>
  <div class="btn" id="bLeap">LEAP</div>
</div>
<div id="overlay"><div class="card">
  <h1 id="dTitle"></h1><div class="sub" id="dSub"></div>
  <div id="dBody"></div>
  <button id="dBtn"></button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const V3 = THREE.Vector3;
const isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
if (isTouch) document.getElementById('touch').style.display = 'block';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias: !isTouch});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 500);
function onResize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 78 : 62;
  camera.updateProjectionMatrix();
}
addEventListener('resize', onResize); onResize();

// sky gradient
(function(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#1b1036'); gr.addColorStop(.45,'#5e2a5c'); gr.addColorStop(.75,'#d9653c'); gr.addColorStop(1,'#ffb35c');
  g.fillStyle = gr; g.fillRect(0,0,4,256);
  scene.background = new THREE.CanvasTexture(c);
})();
scene.fog = new THREE.Fog(0x8a4258, 55, 190);
scene.add(new THREE.HemisphereLight(0xffd9a8, 0x3a2550, 0.95));
const sun = new THREE.DirectionalLight(0xffb070, 0.85); sun.position.set(-30, 40, 25); scene.add(sun);

function lam(c, e){ return new THREE.MeshLambertMaterial({color:c, emissive:e||0}); }
function mesh(geo, mat, x, y, z, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }

// sun disc + ocean
mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({color:0xffc56e, fog:false}), -50, 14, -280);
const ocean = mesh(new THREE.PlaneGeometry(900, 900), lam(0x1d4a6b, 0x0a1a2a), 0, -2, -60);
ocean.rotation.x = -Math.PI/2;

// ---------- particles ----------
const ptex = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.35,'rgba(255,255,255,.75)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
})();
const parts = [];
for (let i = 0; i < 320; i++){
  const m = new THREE.SpriteMaterial({map:ptex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, color:0xffaa33});
  const s = new THREE.Sprite(m); s.visible = false; scene.add(s);
  parts.push({s, life:0, max:1, vx:0, vy:0, vz:0, size:1, kind:0});
}
let pIdx = 0;
function emit(x,y,z,vx,vy,vz,life,size,kind){
  const p = parts[pIdx]; pIdx = (pIdx + 1) % parts.length;
  p.s.position.set(x,y,z); p.vx=vx; p.vy=vy; p.vz=vz; p.life=p.max=life; p.size=size; p.kind=kind; p.s.visible=true;
}
function burst(x,y,z,n,kind,spd){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, u=Math.random()*2-1;
    emit(x,y,z,Math.cos(a)*spd*(.4+Math.random()), Math.abs(u)*spd+2, Math.sin(a)*spd*(.4+Math.random()), .4+Math.random()*.4, .5+Math.random()*.4, kind); }
}
function updParts(dt){
  for (const p of parts){
    if (p.life <= 0) continue;
    p.life -= dt; if (p.life <= 0){ p.s.visible = false; continue; }
    const t = 1 - p.life / p.max;
    p.s.position.x += p.vx*dt; p.s.position.y += p.vy*dt; p.s.position.z += p.vz*dt;
    const m = p.s.material;
    if (p.kind === 0){ // fire
      m.color.setRGB(1, .85*(1-t)+.15, .35*(1-t)); m.opacity = (1-t)*.7;
      const s = p.size*(.6 + t*.9); p.s.scale.set(s,s,s);
    } else { // gold spark
      p.vy -= 18*dt; m.color.setRGB(1,.85,.4); m.opacity = 1-t;
      const s = p.size*(1-t*.6); p.s.scale.set(s,s,s);
    }
  }
}

// ---------- level ----------
const solids = [];
function box(x, top, z, w, d, h, color, opts){
  const m = mesh(new THREE.BoxGeometry(w,h,d), lam(color), x, top-h/2, z);
  const s = Object.assign({minX:x-w/2, maxX:x+w/2, minY:top-h, maxY:top, minZ:z-d/2, maxZ:z+d/2, mesh:m, cx:x, cz:z}, opts||{});
  solids.push(s); return s;
}
const goldMat = lam(0xffc233, 0x3a2200);
const burnables = [];
function house(x, top, z, w, d, opts){
  const s = box(x, top, z, w, d, top+2, 0xe9c896, Object.assign({burnable:true}, opts||{}));
  mesh(new THREE.BoxGeometry(w+.3, .4, d+.3), goldMat, x, top-.22, z);
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    mesh(new THREE.ConeGeometry(.28, 1.1, 8), goldMat, x+sx*(w/2-.3), top+.55, z+sz*(d/2-.3));
  }
  // windows
  const win = lam(0x3a1e18);
  for (let i=-1;i<=1;i++) mesh(new THREE.BoxGeometry(.6,.9,.05), win, x+i*w/3.2, top-1.6, z+d/2+.03);
  burnables.push(s); return s;
}
function tree(x, y, z, s){
  mesh(new THREE.CylinderGeometry(.18*s,.25*s,1.6*s,6), lam(0x5a3a22), x, y+.8*s, z);
  mesh(new THREE.ConeGeometry(1.1*s, 2.6*s, 7), lam(0x2e5a2a), x, y+2.6*s, z);
}

// Mahendra hill (start)
const start = box(0, 2, 10, 12, 12, 6, 0x6e5c4c, {cp:true});
tree(-4.5,2,13.5,1); tree(4.6,2,12.5,1.2); tree(-5,2,6.5,.8); tree(5,2,7,.9);
// stepping rocks in the sea
box(0, 1.6, -2, 4, 4, 3.6, 0x5c5866);
box(3, 2.0, -8.5, 4, 4, 4, 0x5c5866);
box(-1, 2.5, -15, 4, 4, 4.5, 0x5c5866);
const lastRock = box(2, 3, -21.5, 4, 4, 5, 0x5c5866, {id:'lastRock'});
// Lanka shore
const shore = box(0, 3, -48, 16, 12, 5, 0xc4a36e, {cp:true, id:'shore'});
for (const sx of [-1,1]){ // gate pillars (decor)
  mesh(new THREE.CylinderGeometry(.5,.6,6,10), goldMat, sx*7.2, 6, -43);
  mesh(new THREE.SphereGeometry(.7,10,8), goldMat, sx*7.2, 9.4, -43);
}
// rooftops of Lanka
const h1 = house(-4, 5, -60, 6, 6);
const h2 = house(4, 7, -68, 6, 6);
const h3 = house(-3, 9, -77, 6, 6, {cp:true});
const h4 = house(3, 8, -86, 7, 7);
const tower = house(0, 11, -96, 5, 5);
const step = box(3, 8.5, -101, 3, 3, 10.5, 0xa98a62);
// Ashoka Vatika
const garden = box(0, 6, -112, 18, 18, 8, 0x3f6b3a, {cp:true, id:'garden'});
for (const [x,z] of [[-7,-106],[7,-108],[-6,-118],[6,-117],[-2,-104]]) tree(x,6,z,.8);
// the Ashoka tree
mesh(new THREE.CylinderGeometry(.35,.55,4,8), lam(0x5a3a22), 0, 8, -119.5);
const blossom = lam(0xff5a2a, 0x401000), leaf = lam(0x2f5e2a);
for (let i=0;i<9;i++){ const a=i/9*Math.PI*2;
  mesh(new THREE.SphereGeometry(1.4,8,6), leaf, Math.cos(a)*1.8, 10.6+Math.sin(i*1.7)*.5, -119.5+Math.sin(a)*1.8); }
for (let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, r=1+Math.random()*2.4;
  mesh(new THREE.SphereGeometry(.25,6,5), blossom, Math.cos(a)*r, 10+Math.random()*2.2, -119.5+Math.sin(a)*r); }
// Sita
const sitaPos = new V3(0, 6, -117);
(function(){
  const g = new THREE.Group(); g.position.copy(sitaPos); scene.add(g);
  const saree = lam(0xf0b429, 0x2a1800), skin = lam(0xb87a4b), hair = lam(0x1a1010);
  mesh(new THREE.CylinderGeometry(.35,.68,.55,14), saree, 0,.28,0,g);
  mesh(new THREE.CylinderGeometry(.22,.32,.62,12), saree, 0,.86,0,g);
  mesh(new THREE.SphereGeometry(.21,12,10), skin, 0,1.33,.02,g);
  const hr = mesh(new THREE.SphereGeometry(.23,12,10), hair, 0,1.38,-.05,g); hr.scale.set(1,1,.9);
  mesh(new THREE.SphereGeometry(.12,8,6), hair, 0,1.3,-.27,g);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:ptex, color:0xffe2a0, blending:THREE.AdditiveBlending, transparent:true, opacity:.55, depthWrite:false}));
  glow.position.set(0,1,0); glow.scale.set(3.2,3.2,3.2); g.add(glow);
})();
// distant Lanka skyline (decor)
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
for (let i=0;i<22;i++){
  const side = i%2 ? 1 : -1, x = side*(22 + rnd()*30), z = -50 - rnd()*90, h = 8 + rnd()*22;
  mesh(new THREE.BoxGeometry(4+rnd()*4, h, 4+rnd()*4), lam(0xd9b07a), x, -2+h/2, z);
  mesh(new THREE.SphereGeometry(1.6+rnd(), 10, 8), goldMat, x, -2+h+.8, z);
}

// ---------- characters ----------
const furMat = lam(0xd9822b), faceMat = lam(0xf2c48d), redMat = lam(0xb3202a), black = new THREE.MeshBasicMaterial({color:0x111111});
const hanu = new THREE.Group(); scene.add(hanu);
const legs = [];
for (const sx of [-1,1]){ const p = new THREE.Group(); p.position.set(sx*.18,.62,0); hanu.add(p);
  mesh(new THREE.CylinderGeometry(.13,.11,.62,8), furMat, 0,-.31,0,p); legs.push(p); }
mesh(new THREE.CylinderGeometry(.42,.48,.36,12), redMat, 0,.74,0,hanu);
const torso = mesh(new THREE.CylinderGeometry(.34,.42,.75,12), furMat, 0,1.22,0,hanu);
const neck = mesh(new THREE.TorusGeometry(.3,.045,6,16), goldMat, 0,1.52,0,hanu); neck.rotation.x = Math.PI/2;
mesh(new THREE.SphereGeometry(.3,14,12), furMat, 0,1.84,0,hanu);
const muz = mesh(new THREE.SphereGeometry(.19,12,10), faceMat, 0,1.76,.2,hanu); muz.scale.set(1,.8,.9);
for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.04,6,6), black, sx*.1,1.9,.26,hanu);
mesh(new THREE.CylinderGeometry(.17,.24,.3,8), goldMat, 0,2.13,0,hanu);
mesh(new THREE.ConeGeometry(.1,.25,8), goldMat, 0,2.4,0,hanu);
const armL = new THREE.Group(); armL.position.set(-.47,1.48,0); hanu.add(armL);
mesh(new THREE.CylinderGeometry(.1,.09,.62,8), furMat, 0,-.31,0,armL);
const macePivot = new THREE.Group(); macePivot.position.set(.47,1.48,0); hanu.add(macePivot);
mesh(new THREE.CylinderGeometry(.1,.09,.6,8), furMat, 0,.3,0,macePivot);
mesh(new THREE.CylinderGeometry(.05,.06,.9,8), lam(0x8a5a1a), 0,1.0,0,macePivot);
mesh(new THREE.SphereGeometry(.3,14,12), goldMat, 0,1.55,0,macePivot);
mesh(new THREE.ConeGeometry(.08,.2,8), goldMat, 0,1.9,0,macePivot);
const tail = [];
for (let i=0;i<11;i++) tail.push(mesh(new THREE.SphereGeometry(i===10?.11:.085,8,6), furMat, 0,0,0,hanu));
const tipWorld = new V3();
const blob = mesh(new THREE.CircleGeometry(.55,16), new THREE.MeshBasicMaterial({color:0, transparent:true, opacity:.35, depthWrite:false}), 0,0,0);
blob.rotation.x = -Math.PI/2;

function makeRakshasa(){
  const g = new THREE.Group(); scene.add(g);
  const bodyMat = lam(0x4a2a63), skin = lam(0x3d5878), dark = lam(0x241433);
  for (const sx of [-1,1]) mesh(new THREE.CylinderGeometry(.14,.12,.62,8), dark, sx*.2,.31,0,g);
  mesh(new THREE.CylinderGeometry(.42,.52,1.25,10), bodyMat, 0,1.2,0,g);
  mesh(new THREE.SphereGeometry(.33,12,10), skin, 0,2.05,0,g);
  for (const sx of [-1,1]){ const h = mesh(new THREE.ConeGeometry(.07,.35,6), lam(0xeeeeee), sx*.18,2.38,0,g); h.rotation.z = -sx*.45; }
  const eye = new THREE.MeshBasicMaterial({color:0xff2222});
  for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.055,6,6), eye, sx*.12,2.1,.28,g);
  const arm = new THREE.Group(); arm.position.set(.58,1.6,0); g.add(arm);
  mesh(new THREE.CylinderGeometry(.11,.1,.6,8), skin, 0,.3,0,arm);
  mesh(new THREE.CylinderGeometry(.16,.07,1.0,8), lam(0x4a3020), 0,1.0,0,arm);
  return {g, bodyMat, arm};
}
const enemies = [];
function spawnEnemy(s, x, z){
  const r = makeRakshasa();
  const e = {mesh:r.g, bodyMat:r.bodyMat, arm:r.arm, pos:new V3(x, s.maxY, z), hp:3, hurt:0, wind:0, swing:0, atkCd:.6,
    kb:new V3(), face:0, pdir:Math.random()<.5?-1:1, dead:false, gone:false, deadT:0,
    b:{minX:s.minX+.6, maxX:s.maxX-.6, minZ:s.minZ+.6, maxZ:s.maxZ-.6}};
  r.g.position.copy(e.pos); enemies.push(e); return e;
}
spawnEnemy(shore,-3,-46); spawnEnemy(shore,4,-51);
spawnEnemy(h2,4,-68); spawnEnemy(h4,3,-86);
spawnEnemy(garden,-5,-108); spawnEnemy(garden,5,-110); spawnEnemy(garden,0,-106);

// ---------- player ----------
const P = {pos:new V3(0,2,11), vel:new V3(), onGround:false, ground:null, jumps:0, coyote:0, facing:Math.PI, tFacing:Math.PI,
  hp:5, inv:0, attackT:0, hitPending:false, leapCd:0, leaping:false, usedLeap:false};
const checkpoint = new V3(0,2,11);
const R = .4, H = 1.75;
function overlaps(p, s){ return p.x+R>s.minX && p.x-R<s.maxX && p.z+R>s.minZ && p.z-R<s.maxZ && p.y+H>s.minY && p.y<s.maxY; }
function moveAxis(axis, amt){
  if (amt === 0) return;
  P.pos[axis] += amt;
  for (const s of solids){
    if (!overlaps(P.pos, s)) continue;
    if (axis === 'y'){
      if (amt < 0){ P.pos.y = s.maxY; P.vel.y = 0; P.onGround = true; P.ground = s; }
      else { P.pos.y = s.minY - H; P.vel.y = 0; }
    } else if (axis === 'x'){ P.pos.x = amt > 0 ? s.minX - R : s.maxX + R; }
    else { P.pos.z = amt > 0 ? s.minZ - R : s.maxZ + R; }
  }
}
function groundBelow(x, z, y){
  let best = -999;
  for (const s of solids) if (x>s.minX && x<s.maxX && z>s.minZ && z<s.maxZ && s.maxY<=y+.05 && s.maxY>best) best = s.maxY;
  return best;
}

// ---------- input ----------
const input = {x:0, y:0, jumpP:false, attackP:false, leapP:false};
const keys = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (paused && (e.code==='Enter' || e.code==='Space')){ dBtn.click(); return; }
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code==='Space') input.jumpP = true;
  if (e.code==='KeyJ') input.attackP = true;
  if (e.code==='KeyK' || e.code==='ShiftLeft' || e.code==='ShiftRight') input.leapP = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });

let camYaw = 0, camPitch = .32, camPtr = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  if (camPtr) return;
  camPtr = {id:e.pointerId, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, t:performance.now()};
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e => {
  if (!camPtr || e.pointerId !== camPtr.id) return;
  camYaw -= (e.clientX - camPtr.x) * .006;
  camPitch = Math.max(.05, Math.min(1.1, camPitch + (e.clientY - camPtr.y) * .004));
  camPtr.x = e.clientX; camPtr.y = e.clientY;
});
function camUp(e){
  if (!camPtr || e.pointerId !== camPtr.id) return;
  const moved = Math.hypot(e.clientX-camPtr.sx, e.clientY-camPtr.sy);
  if (moved < 8 && performance.now()-camPtr.t < 300) input.attackP = true;
  camPtr = null;
}
cv.addEventListener('pointerup', camUp); cv.addEventListener('pointercancel', camUp);

// touch joystick + buttons
const joy = document.getElementById('joy'), joybase = document.getElementById('joybase'), knob = document.getElementById('joyknob');
let joyPtr = null;
joy.addEventListener('pointerdown', e => {
  e.preventDefault(); joyPtr = {id:e.pointerId, ox:e.clientX, oy:e.clientY};
  try { joy.setPointerCapture(e.pointerId); } catch(_){}
  joybase.style.display = 'block'; joybase.style.left = e.clientX+'px'; joybase.style.top = e.clientY+'px';
  knob.style.transform = '';
});
joy.addEventListener('pointermove', e => {
  if (!joyPtr || e.pointerId !== joyPtr.id) return;
  let dx = e.clientX-joyPtr.ox, dy = e.clientY-joyPtr.oy; const l = Math.hypot(dx,dy), m = 50;
  if (l > m){ dx = dx/l*m; dy = dy/l*m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  input.x = dx/m; input.y = -dy/m;
});
function joyEnd(e){ if (!joyPtr || e.pointerId !== joyPtr.id) return; joyPtr = null; input.x = input.y = 0; joybase.style.display = 'none'; }
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
function bindBtn(id, key){
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); input[key] = true; b.classList.add('on'); });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}
bindBtn('bAtk','attackP'); bindBtn('bJump','jumpP'); bindBtn('bLeap','leapP');
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- UI ----------
const $ = id => document.getElementById(id);
const overlay = $('overlay'), dBtn = $('dBtn');
let paused = true;
function dialog(title, sub, html, btn, cb){
  paused = true; overlay.style.display = 'flex';
  $('dTitle').textContent = title; $('dSub').textContent = sub || ''; $('dBody').innerHTML = html; dBtn.textContent = btn;
  dBtn.onclick = () => {
    overlay.style.display = 'none'; paused = false; last = performance.now();
    input.jumpP = input.attackP = input.leapP = false;
    if (cb) cb();
  };
}
let hintTimer = 0;
function hint(t, secs){ $('hint').textContent = t; $('hint').style.opacity = 1; hintTimer = secs || 3; }
function flash(){ $('flash').style.opacity = .35; setTimeout(() => $('flash').style.opacity = 0, 120); }
function setObj(t){ $('obj').textContent = t; }
let shake = 0;

// ---------- game state ----------
let phase = 'search', burned = 0, won = false, tailFire = false, seenShore = false, rings = [];
const fires = [];
setObj('Leap across the ocean to Lanka. Find Sita.');

function hurtPlayer(src){
  if (P.inv > 0 || won) return;
  P.hp--; P.inv = 1; flash(); shake = .25;
  const dx = P.pos.x-src.pos.x, dz = P.pos.z-src.pos.z, d = Math.hypot(dx,dz) || 1;
  P.vel.x = dx/d*9; P.vel.z = dz/d*9; P.vel.y = 6; P.leaping = false;
  if (P.hp <= 0) knockedOut();
}
function knockedOut(){
  dialog('Knocked down', '', '<p>Vayu\'s son is never truly defeated. Rise again from the last checkpoint.</p>', 'Rise again', respawn);
}
function respawn(){
  P.pos.copy(checkpoint); P.pos.y += .05; P.vel.set(0,0,0); P.leaping = false; P.hp = Math.max(P.hp, 0) || 5; P.inv = 1.2;
}
function ignite(s){
  s.burned = true; burned++;
  fires.push({x:s.cx, y:s.maxY, z:s.cz, w:s.maxX-s.minX, d:s.maxZ-s.minZ, acc:0, s});
  s.mesh.material.color.setHex(0x5a3a2a);
  if (s.ring){ scene.remove(s.ring); s.ring = null; }
  for (let i=0;i<25;i++) emit(s.cx+(Math.random()-.5)*4, s.maxY+.3, s.cz+(Math.random()-.5)*4, (Math.random()-.5)*4, 4+Math.random()*5, (Math.random()-.5)*4, .9, 2, 0);
  shake = .3;
  if (burned >= burnables.length){
    phase = 'return';
    setObj('Lanka burns. Return to the shore and leap home across the ocean!');
    hint('Lanka burns! Back to the shore — leap home!', 4);
  } else setObj(`Lanka Dahan: burn the golden roofs — ${burned}/${burnables.length}`);
}
function startBurnPhase(){
  phase = 'burn'; tailFire = true;
  spawnEnemy(shore,0,-50); spawnEnemy(h1,-4,-60); spawnEnemy(h3,-3,-77); spawnEnemy(tower,0,-96); spawnEnemy(garden,3,-104);
  for (const s of burnables){
    const r = mesh(new THREE.TorusGeometry(1.3,.09,6,28), new THREE.MeshBasicMaterial({color:0xff7a1a}), s.cx, s.maxY+.15, s.cz);
    r.rotation.x = -Math.PI/2; s.ring = r; rings.push(r);
  }
  setObj(`Lanka Dahan: burn the golden roofs — 0/${burnables.length}`);
  hint('Land on each glowing roof to set it ablaze!', 4);
}
function meetSita(){
  phase = 'cutscene';
  dialog('Ashoka Vatika', 'Sundara Kandam',
    '<p>Hanuman bows low before Sita and offers Rama\'s signet ring.</p><p><i>"Rama is coming for you, Mother."</i></p><p>She gives him her chudamani to carry back to Rama.</p>',
    'Continue', () => dialog('Captured!', '',
      '<p>Ravana\'s guards seize Hanuman and set his tail on fire to shame him.</p><p>A grave mistake.</p>',
      'Burn Lanka', startBurnPhase));
}
function victory(){
  won = true;
  dialog('Jai Hanuman!', 'Chapter complete',
    '<p>Hanuman douses his blazing tail in the ocean and leaps home to Rama with Sita\'s chudamani.</p><p>Next chapter: <b>Setu Bandhanam</b> — building the bridge to Lanka.</p>',
    'Play again', () => location.reload());
}

// ---------- update ----------
function updatePlayer(dt){
  P.inv = Math.max(0, P.inv-dt); P.leapCd = Math.max(0, P.leapCd-dt); P.attackT = Math.max(0, P.attackT-dt);
  const kx = ((keys.KeyD||keys.ArrowRight)?1:0) - ((keys.KeyA||keys.ArrowLeft)?1:0);
  const ky = ((keys.KeyW||keys.ArrowUp)?1:0) - ((keys.KeyS||keys.ArrowDown)?1:0);
  camYaw += ((keys.KeyQ?1:0) - (keys.KeyE?1:0)) * dt * 2.2;
  const ix = input.x + kx, iy = input.y + ky;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  let wx = fx*iy + rx*ix, wz = fz*iy + rz*ix; let wl = Math.hypot(wx,wz);
  if (wl > 1){ wx/=wl; wz/=wl; wl=1; }
  if (wl > .15) P.tFacing = Math.atan2(wx, wz);
  let da = P.tFacing - P.facing; da = Math.atan2(Math.sin(da), Math.cos(da));
  P.facing += da * Math.min(1, dt*14);
  const spd = 9;
  if (!P.leaping){
    const k = P.onGround ? 14 : 5;
    P.vel.x += (wx*spd - P.vel.x) * Math.min(1, dt*k);
    P.vel.z += (wz*spd - P.vel.z) * Math.min(1, dt*k);
  } else { P.vel.x += wx*5*dt; P.vel.z += wz*5*dt; }
  P.coyote = P.onGround ? .12 : Math.max(0, P.coyote-dt);
  if (input.leapP){
    if (P.leapCd <= 0 && (P.onGround || P.coyote > 0)){
      const lx = Math.sin(P.facing), lz = Math.cos(P.facing);
      P.vel.x = lx*22; P.vel.z = lz*22; P.vel.y = 15; P.leaping = true; P.leapCd = 3; P.jumps = 2; P.coyote = 0; P.usedLeap = true;
      burst(P.pos.x, P.pos.y+.2, P.pos.z, 14, 1, 5); shake = .15;
    } else if (P.leapCd > 0) hint('Leap recharging…', 1);
    else hint('Leap from solid ground', 1);
  }
  if (input.jumpP){
    if (P.onGround || P.coyote > 0){ P.vel.y = 12.5; P.jumps = 1; P.coyote = 0; }
    else if (P.jumps < 2){ P.vel.y = 11; P.jumps = 2; burst(P.pos.x, P.pos.y, P.pos.z, 6, 1, 3); }
  }
  if (input.attackP && P.attackT <= .08){
    let best = null, bd = 3.8;
    for (const e of enemies){ if (e.dead) continue; const d = Math.hypot(e.pos.x-P.pos.x, e.pos.z-P.pos.z);
      if (d < bd && Math.abs(e.pos.y-P.pos.y) < 2){ bd = d; best = e; } }
    if (best){ P.tFacing = P.facing = Math.atan2(best.pos.x-P.pos.x, best.pos.z-P.pos.z); }
    P.attackT = .36; P.hitPending = true;
  }
  if (P.hitPending && P.attackT < .2){
    P.hitPending = false;
    const sf = Math.sin(P.facing), cf = Math.cos(P.facing);
    for (const e of enemies){
      if (e.dead) continue;
      const dx = e.pos.x-P.pos.x, dz = e.pos.z-P.pos.z, d = Math.hypot(dx,dz) || .01;
      if (d < 2.7 && Math.abs(e.pos.y-P.pos.y) < 1.9 && (d < 1 || (dx*sf+dz*cf)/d > .2)){
        e.hp--; e.hurt = .22; e.wind = 0; e.kb.set(dx/d*5, 0, dz/d*5);
        burst(e.pos.x, e.pos.y+1.4, e.pos.z, 10, 1, 6); shake = .12;
        if (e.hp <= 0){ e.dead = true; e.deadT = .5; }
      }
    }
  }
  P.vel.y = Math.max(P.vel.y - (P.leaping ? 22 : 30)*dt, -40);
  const wasGround = P.onGround;
  P.onGround = false; P.ground = null;
  moveAxis('x', P.vel.x*dt); moveAxis('z', P.vel.z*dt); moveAxis('y', P.vel.y*dt);
  if (P.onGround){
    P.jumps = 0;
    if (P.leaping){ P.leaping = false; burst(P.pos.x, P.pos.y+.1, P.pos.z, 12, 1, 4); shake = .15; }
    const g = P.ground;
    if (g && g.cp && !wasGround){ checkpoint.set(g.cx, g.maxY, g.cz); }
    if (g && g.id === 'lastRock' && !P.usedLeap && phase === 'search') { hint('The ocean is too wide — press LEAP!', 2); $('bLeap').classList.add('pulse'); }
    if (g && g.id === 'shore' && !seenShore){ seenShore = true; $('bLeap').classList.remove('pulse');
      setObj('Find Sita in Ashoka Vatika — follow the golden rooftops.'); hint('Lanka, the golden city', 3); }
    if (phase === 'burn' && g && g.burnable && !g.burned) ignite(g);
  }
  // win / fall
  if (phase === 'return' && P.pos.z > -41.5 && !won){ victory(); return; }
  if (P.pos.y < -2.6){
    burst(P.pos.x, -1.8, P.pos.z, 10, 1, 4);
    P.hp--; flash();
    if (P.hp <= 0) knockedOut(); else respawn();
  }
  if (phase === 'search' && P.pos.distanceTo(sitaPos) < 2.8) meetSita();
}

function updateEnemies(dt){
  for (const e of enemies){
    if (e.gone) continue;
    if (e.dead){
      e.deadT -= dt; const s = Math.max(.01, e.deadT/.5); e.mesh.scale.set(s,s,s); e.mesh.rotation.z += dt*7;
      if (e.deadT <= 0){ scene.remove(e.mesh); e.gone = true; }
      continue;
    }
    e.atkCd = Math.max(0, e.atkCd-dt); e.hurt = Math.max(0, e.hurt-dt); e.swing = Math.max(0, e.swing-dt);
    const dx = P.pos.x-e.pos.x, dz = P.pos.z-e.pos.z, d = Math.hypot(dx,dz) || .01;
    const same = Math.abs(P.pos.y-e.pos.y) < 2.2;
    let mx = 0, mz = 0;
    if (e.wind > 0){
      e.wind -= dt;
      if (e.wind <= 0){ e.swing = .25; if (d < 2.2 && same) hurtPlayer(e); }
    } else if (same && d < 8 && e.hurt <= 0){
      e.face = Math.atan2(dx, dz);
      if (d > 1.5){ mx = dx/d; mz = dz/d; }
      else if (e.atkCd <= 0){ e.wind = .45; e.atkCd = 1.4; }
    } else {
      if (e.pos.x > e.b.maxX-.05) e.pdir = -1; else if (e.pos.x < e.b.minX+.05) e.pdir = 1;
      mx = e.pdir*.6; e.face = Math.atan2(mx, 0);
    }
    const sp = e.hurt > 0 ? 0 : 3.3;
    e.pos.x += (mx*sp + e.kb.x)*dt; e.pos.z += (mz*sp + e.kb.z)*dt;
    e.kb.multiplyScalar(Math.max(0, 1-dt*8));
    e.pos.x = Math.max(e.b.minX, Math.min(e.b.maxX, e.pos.x));
    e.pos.z = Math.max(e.b.minZ, Math.min(e.b.maxZ, e.pos.z));
    e.mesh.position.set(e.pos.x, e.pos.y + (mx||mz ? Math.abs(Math.sin(time*9))*.08 : 0), e.pos.z);
    let da = e.face - e.mesh.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da)); e.mesh.rotation.y += da*Math.min(1, dt*10);
    e.arm.rotation.x = e.wind > 0 ? -2.3 : (e.swing > 0 ? 1.4 : -.3);
    e.bodyMat.emissive.setHex(e.hurt > 0 ? 0xaa0000 : (e.wind > 0 ? 0x3a0000 : 0));
  }
}

function animateHanuman(dt){
  hanu.position.copy(P.pos); hanu.rotation.y = P.facing;
  const sp = Math.hypot(P.vel.x, P.vel.z);
  const run = P.onGround && sp > 1;
  const sw = run ? Math.sin(time*13)*.7 : 0;
  legs[0].rotation.x = P.onGround ? sw : -.6; legs[1].rotation.x = P.onGround ? -sw : .3;
  armL.rotation.x = P.leaping ? -2.6 : (run ? -sw*.6 : 0);
  torso.rotation.x = P.leaping ? .35 : (run ? .12 : 0);
  if (P.attackT > 0){
    const p = 1 - P.attackT/.36;
    macePivot.rotation.x = p < .3 ? -.4 + (-1.9)*(p/.3) : -2.3 + 4.1*((p-.3)/.7);
  } else macePivot.rotation.x += (-.4 - macePivot.rotation.x)*Math.min(1, dt*10);
  macePivot.rotation.z = -.15;
  hanu.visible = !(P.inv > 0 && Math.floor(time*20)%2 === 0);
  for (let i=0;i<tail.length;i++){
    const t = i/(tail.length-1);
    tail[i].position.set(Math.sin(time*3 - i*.45)*.18*t, .7 + t*1.35 + Math.sin(t*Math.PI)*.1, -.36 - t*.8 + t*t*.45);
  }
  tail[tail.length-1].getWorldPosition(tipWorld);
  const gy = groundBelow(P.pos.x, P.pos.z, P.pos.y);
  blob.visible = gy > -100; blob.position.set(P.pos.x, gy+.03, P.pos.z);
  const hgt = P.pos.y - gy; const bs = Math.max(.4, 1 - hgt*.06); blob.scale.set(bs,bs,bs);
}

let fireAcc = 0;
function updateFires(dt){
  if (tailFire){
    fireAcc += dt*45;
    while (fireAcc > 1){ fireAcc--; emit(tipWorld.x+(Math.random()-.5)*.15, tipWorld.y+.05, tipWorld.z+(Math.random()-.5)*.15,
      (Math.random()-.5)*.6, 1.8+Math.random()*1.5, (Math.random()-.5)*.6, .35+Math.random()*.25, .55+Math.random()*.35, 0); }
  }
  for (const f of fires){
    f.acc += dt*16;
    while (f.acc > 1){ f.acc--; emit(f.x+(Math.random()-.5)*f.w*.9, f.y+.2, f.z+(Math.random()-.5)*f.d*.9,
      (Math.random()-.5)*.8, 2.5+Math.random()*3, (Math.random()-.5)*.8, .6+Math.random()*.5, .9+Math.random()*.9, 0); }
    f.s.mesh.material.emissive.setRGB(.35+.15*Math.sin(time*17+f.x), .08, 0);
  }
  for (const r of rings){ if (r.parent){ const s = 1 + Math.sin(time*5)*.12; r.scale.set(s,s,s); } }
}

// ---------- HUD ----------
let lastHp = -1, lastLeap = -1;
function updateHud(){
  if (P.hp !== lastHp){ lastHp = P.hp; $('hearts').textContent = '❤️'.repeat(Math.max(0,P.hp)) + '🤍'.repeat(Math.max(0,5-P.hp)); }
  const lf = Math.round((1 - P.leapCd/3)*100);
  if (lf !== lastLeap){ lastLeap = lf; $('leapfill').style.width = lf + '%'; }
}

// ---------- camera ----------
const camTarget = new V3(), camDesired = new V3();
function updateCamera(dt){
  camTarget.set(P.pos.x, P.pos.y+1.4, P.pos.z);
  const dist = 7.5 + (P.leaping ? 3 : 0), cp = Math.cos(camPitch);
  camDesired.set(camTarget.x + Math.sin(camYaw)*dist*cp, camTarget.y + Math.sin(camPitch)*dist + .6, camTarget.z + Math.cos(camYaw)*dist*cp);
  camera.position.lerp(camDesired, 1 - Math.exp(-dt*7));
  if (shake > 0){ shake = Math.max(0, shake-dt); camera.position.x += (Math.random()-.5)*shake; camera.position.y += (Math.random()-.5)*shake; }
  camera.lookAt(camTarget);
}

// ---------- loop ----------
let last = performance.now(), time = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - last)/1000, .033); last = now;
  if (!paused){
    time += dt;
    updatePlayer(dt);
    if (!paused) updateEnemies(dt);
    updateFires(dt);
    if (hintTimer > 0){ hintTimer -= dt; if (hintTimer <= 0) $('hint').style.opacity = 0; }
  }
  input.jumpP = input.attackP = input.leapP = false;
  animateHanuman(paused ? 0 : dt);
  updParts(paused ? 0 : dt);
  updateCamera(dt);
  updateHud();
  renderer.render(scene, camera);
}
camera.position.set(0, 6, 20);
requestAnimationFrame(loop);

const controls = isTouch
  ? '<div class="keys">Left thumb: move · Drag right side: camera<br>JUMP (tap again in air to double-jump) · GADA: attack · LEAP: giant leap</div>'
  : '<div class="keys">WASD / arrows: move · Space: jump (double-jump in air)<br>J or click: gada attack · K or Shift: giant LEAP<br>Drag mouse or Q/E: camera</div>';
dialog("Hanuman's Leap", 'Sundara Kandam · Prototype',
  '<p>Sita is held captive in Lanka. Cross the ocean, find her in Ashoka Vatika, and show Ravana what a single messenger can do.</p>' + controls,
  'Begin', () => hint('Hop the rocks to the edge of the sea', 3));
window.__game = {P, enemies, solids, get phase(){return phase;}, get paused(){return paused;}};
})();
</script>
